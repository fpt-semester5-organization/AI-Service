paths:
  /auth/anonymous:
    post:
      tags:
      - AUTH
      operationId: createAnonymousSession
      summary: FN-AUTH-01 Khởi tạo phiên Khách (Guest UUID)
      description: 'Nhận diện thiết bị Khách bằng Cookie guest_uuid (sinh UUID v4 nếu chưa có), khởi tạo bộ đếm hạn mức dùng thử trên Redis, xác
        định quốc gia truy cập qua IP và cấp Anonymous JWT vai trò GUEST hiệu lực 24 giờ.


        Auth: Public.'
      x-fn-id: FN-AUTH-01
      x-status: Approved
      security: []
      parameters:
      - name: guest_uuid
        in: cookie
        required: false
        schema:
          type: string
        description: UUID v4 — Định danh thiết bị Khách; sinh mới nếu thiếu.
      responses:
        '200':
          description: Khởi tạo phiên khách thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnonymousSessionResponse'
              example:
                statusCode: 200
                message: Khởi tạo phiên khách thành công.
                data:
                  tokenType: Bearer
                  accessToken: eyJhbGciOi...
                  expiresIn: 86400
                  role: GUEST
                  guestId: 3f2c9d1e-8b7a-4c2d-9e10-5a6b7c8d9e0f
                  countryCode: VN
        '429':
          description: 'ERR_GUEST_RATE_LIMIT_EXCEEDED: IP gửi quá 10 requests/phút; IP bị chặn tạm thời (BR-GUEST-SEC-01).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'ERR_SYS_REDIS_UNAVAILABLE: Không kết nối được Redis; hệ thống từ chối thay vì bỏ qua hạn mức.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guest/quota:
    get:
      tags:
      - AUTH
      operationId: getGuestQuota
      summary: FN-AUTH-02 Tra cứu hạn mức dùng thử còn lại
      description: 'Trả về số lượt đã dùng/còn lại của từng hạn mức dùng thử để Frontend hiển thị "Còn N lượt" và quyết định thời điểm mời đăng
        ký: AI (Chatbot, gợi ý món, nhận diện tủ lạnh, xem bản STT) dùng chung 03 lượt/phiên; quét mã vạch 03 lần/ngày; tìm quán 03 lần.


        Auth: Bearer (Anonymous JWT, role GUEST).'
      x-fn-id: FN-AUTH-02
      x-status: Approved
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lấy hạn mức dùng thử thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGuestQuotaResponse'
              example:
                statusCode: 200
                message: Lấy hạn mức dùng thử thành công.
                data:
                  ai:
                    used: 1
                    limit: 3
                    remaining: 2
                  barcodeDaily:
                    used: 3
                    limit: 3
                    remaining: 0
                  mapSearch:
                    used: 1
                    limit: 3
                    remaining: 2
                  resetAt: '2026-10-06T08:15:00Z'
        '401':
          description: 'ERR_AUTH_INVALID_TOKEN: Thiếu, sai chữ ký hoặc hết hạn JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'ERR_GUEST_RATE_LIMIT_EXCEEDED: IP gửi quá 10 requests/phút; IP bị chặn tạm thời (BR-GUEST-SEC-01).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'ERR_SYS_REDIS_UNAVAILABLE: Không kết nối được Redis; hệ thống từ chối thay vì bỏ qua hạn mức.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      tags:
      - AUTH
      operationId: register
      summary: FN-AUTH-04 Đăng ký tài khoản Email/Mật khẩu + gửi OTP
      description: 'Tạo tài khoản ở trạng thái PENDING_ACTIVATION từ Họ tên, Email và Mật khẩu đạt chuẩn; sinh mã OTP 6 chữ số hiệu lực 5 phút,
        lưu trên Redis và gửi tới Email để kích hoạt.


        Auth: Public (Anonymous JWT tùy chọn).'
      x-fn-id: FN-AUTH-04
      x-status: Approved
      security:
      - {}
      - bearerAuth: []
      responses:
        '201':
          description: Đăng ký thành công. Vui lòng nhập mã OTP đã gửi tới email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                statusCode: 201
                message: Đăng ký thành công. Vui lòng nhập mã OTP đã gửi tới email.
                data:
                  email: an.nguyen@gmail.com
                  otpExpiresIn: 300
        '400':
          description: 'ERR_VALIDATION: Dữ liệu đầu vào sai định dạng hoặc thiếu trường bắt buộc. | ERR_AUTH_WEAK_PASSWORD: Mật khẩu không đạt
            BR-AUTH-001.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'ERR_AUTH_EMAIL_EXISTS: Email đã được đăng ký.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'ERR_GUEST_RATE_LIMIT_EXCEEDED: IP gửi quá 10 requests/phút; IP bị chặn tạm thời (BR-GUEST-SEC-01).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'ERR_SYS_DATABASE_UNAVAILABLE: Không kết nối được SQL Server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: Nguyễn An
              email: an.nguyen@gmail.com
              password: Veggie@2026
              confirmPassword: Veggie@2026
  /auth/verify-otp:
    post:
      tags:
      - AUTH
      operationId: verifyOtp
      summary: FN-AUTH-05 Xác thực OTP kích hoạt tài khoản
      description: 'Xác thực mã OTP kích hoạt, chuyển tài khoản sang ACTIVE, cấp cặp token và hợp nhất ngữ cảnh hội thoại AI của phiên Khách vào
        tài khoản mới.


        Auth: Public (Anonymous JWT tùy chọn).'
      x-fn-id: FN-AUTH-05
      x-status: Approved
      security:
      - {}
      - bearerAuth: []
      responses:
        '200':
          description: Kích hoạt tài khoản thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
              example:
                statusCode: 200
                message: Kích hoạt tài khoản thành công.
                data:
                  tokenType: Bearer
                  accessToken: eyJhbGciOiJIUzI1NiIs...
                  expiresIn: 900
                  user: &id015
                    userId: 1024
                    email: an.nguyen@gmail.com
                    fullName: Nguyễn An
                    role: MEMBER
                    isVip: false
                    accountStatus: ACTIVE
                    isProfileCompleted: false
                  redirectUrl: /onboarding/health-profile
        '400':
          description: 'ERR_VALIDATION: Dữ liệu đầu vào sai định dạng hoặc thiếu trường bắt buộc. | ERR_AUTH_OTP_INCORRECT: Sai mã; data.remainingAttempts.
            | ERR_AUTH_OTP_EXPIRED: Mã hết hạn.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'ERR_AUTH_OTP_LOCKED: Sai 5 lần; khóa 15 phút.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'ERR_SYS_DATABASE_UNAVAILABLE: Không kết nối được SQL Server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
