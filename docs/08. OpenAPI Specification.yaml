openapi: '3.0.3'
info:
  title: VeggieLife API
  version: '1.0.0'
  description: 'Approved for implementation. Sinh tự động từ scripts/master_spec (không sửa tay). Envelope thành công {statusCode, message, data[,
    meta]}; lỗi {statusCode, errorCode, message[, details]} (D52). JWT role: GUEST (Anonymous JWT), MEMBER, VIP, ADMIN + claim isVip (D104).'
  license:
    name: Proprietary — SWP391 Group 7 (đồ án học thuật)
servers:
- url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    Error:
      type: object
      required:
      - statusCode
      - errorCode
      - message
      properties:
        statusCode:
          type: integer
        errorCode:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
    CreateAnonymousSessionResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            tokenType:
              type: string
            accessToken:
              type: string
            expiresIn:
              type: integer
            role:
              type: string
            guestId:
              type: string
            countryCode:
              type: string
      required:
      - statusCode
      - message
      - data
    GetGuestQuotaResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            ai:
              type: object
              properties:
                used:
                  type: integer
                limit:
                  type: integer
                remaining:
                  type: integer
            barcodeDaily:
              type: object
              properties:
                used:
                  type: integer
                limit:
                  type: integer
                remaining:
                  type: integer
            mapSearch:
              type: object
              properties:
                used:
                  type: integer
                limit:
                  type: integer
                remaining:
                  type: integer
            resetAt:
              type: string
              format: date-time
      required:
      - statusCode
      - message
      - data
    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          description: 2–100 ký tự — Họ tên hiển thị.
        email:
          type: string
          maxLength: 150
          format: email
          description: định dạng email, ≤ 150 ký tự — Email đăng nhập.
        password:
          type: string
          description: BR-AUTH-001 — Mật khẩu.
        confirmPassword:
          type: string
          description: trùng password — Nhập lại mật khẩu.
      required:
      - fullName
      - email
      - password
      - confirmPassword
    RegisterResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            email:
              type: string
            otpExpiresIn:
              type: integer
      required:
      - statusCode
      - message
      - data
    VerifyOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: định dạng email
        otp:
          type: string
          description: 6 chữ số
      required:
      - email
      - otp
    VerifyOtpResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            tokenType:
              type: string
            accessToken:
              type: string
            expiresIn:
              type: integer
            user:
              type: object
              properties:
                userId:
                  type: integer
                email:
                  type: string
                fullName:
                  type: string
                role:
                  type: string
                  enum: &id001
                  - MEMBER
                  - VIP
                  - ADMIN
                isVip:
                  type: boolean
                accountStatus:
                  type: string
                  enum: &id002
                  - PENDING_ACTIVATION
                  - ACTIVE
                  - QUARANTINED
                  - SUSPENDED
                  - BANNED
                  - SOFT_DELETED
                  - ANONYMIZED_DELETED
                isProfileCompleted:
                  type: boolean
            redirectUrl:
              type: string
      required:
      - statusCode
      - message
      - data
    ResendOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: định dạng email
        purpose:
          type: string
          enum:
          - EMAIL_VERIFY
          - PASSWORD_RESET
          description: EMAIL_VERIFY | PASSWORD_RESET
      required:
      - email
      - purpose
    ResendOtpResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
      required:
      - statusCode
      - message
      - data
    LoginWithGoogleRequest:
      type: object
      properties:
        idToken:
          type: string
          description: Google ID Token
        currentPassword:
          type: string
          description: bắt buộc khi liên kết
      required:
      - idToken
    LoginWithGoogleResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            tokenType:
              type: string
            accessToken:
              type: string
            expiresIn:
              type: integer
            user:
              type: object
              properties:
                userId:
                  type: integer
                email:
                  type: string
                fullName:
                  type: string
                role:
                  type: string
                  enum: *id001
                isVip:
                  type: boolean
                accountStatus:
                  type: string
                  enum: *id002
                isProfileCompleted:
                  type: boolean
            isNewAccount:
              type: boolean
      required:
      - statusCode
      - message
      - data
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: định dạng email
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 8–64 ký tự
        restoreAccount:
          type: boolean
          default: false
          description: mặc định false — Khôi phục tài khoản đang ân hạn xóa.
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            tokenType:
              type: string
            accessToken:
              type: string
            expiresIn:
              type: integer
            user:
              type: object
              properties:
                userId:
                  type: integer
                email:
                  type: string
                fullName:
                  type: string
                role:
                  type: string
                  enum: *id001
                isVip:
                  type: boolean
                accountStatus:
                  type: string
                  enum: *id002
                isProfileCompleted:
                  type: boolean
      required:
      - statusCode
      - message
      - data
    RefreshTokenResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            tokenType:
              type: string
            accessToken:
              type: string
            expiresIn:
              type: integer
      required:
      - statusCode
      - message
      - data
    LogoutResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
      required:
      - statusCode
      - message
      - data
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: định dạng email
      required:
      - email
    ForgotPasswordResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
      required:
      - statusCode
      - message
      - data
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 150
          format: email
          description: định dạng email, ≤ 150 ký tự (Users.Email)
        otp:
          type: string
          description: 6 chữ số
        newPassword:
          type: string
          description: BR-AUTH-001
      required:
      - email
      - otp
      - newPassword
    ResetPasswordResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
      required:
      - statusCode
      - message
      - data
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 64
          description: 1–64 ký tự
        newPassword:
          type: string
          description: BR-AUTH-001
      required:
      - currentPassword
      - newPassword
    ChangePasswordResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
      required:
      - statusCode
      - message
      - data
    GetCurrentUserResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            userId:
              type: integer
            fullName:
              type: string
            email:
              type: string
            phoneNumber:
              type: string
            avatarUrl:
              type: string
            role:
              type: string
              enum: *id001
            isVip:
              type: boolean
            health:
              type: object
              properties:
                gender:
                  type: string
                  enum: &id003
                  - MALE
                  - FEMALE
                dateOfBirth:
                  type: string
                  format: date
                heightCm:
                  type: number
                currentWeightKg:
                  type: number
                targetWeightKg:
                  type: number
                bmi:
                  type: number
                bmiCategory:
                  type: string
                bmrKcal:
                  type: number
                tdeeKcal:
                  type: number
                targetDailyCalories:
                  type: number
                healthGoal:
                  type: string
                  enum: &id004
                  - LOSE_WEIGHT
                  - MAINTAIN
                  - GAIN_MUSCLE
                dietarySchool:
                  type: object
                  properties:
                    id:
                      type: integer
                    code:
                      type: string
                    name:
                      type: string
                requiresAlliumFree:
                  type: boolean
                regionPreference:
                  type: string
                isStaleMetrics:
                  type: boolean
                updatedAt:
                  type: string
                  format: date-time
            allergens:
              type: array
              items:
                type: object
                properties:
                  allergenId:
                    type: integer
                  name:
                    type: string
      required:
      - statusCode
      - message
      - data
    UpdateCurrentUserRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          description: 2–100 ký tự
        phoneNumber:
          type: string
          description: ^0(3|5|7|8|9)[0-9]{8}$
    UpdateCurrentUserResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            userId:
              type: integer
            fullName:
              type: string
            phoneNumber:
              type: string
      required:
      - statusCode
      - message
      - data
    UploadCurrentUserAvatarForm:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: 'JPEG/PNG/WEBP ≤ 5 MB — Content-Type: multipart/form-data'
      required:
      - file
    UploadCurrentUserAvatarResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            avatarUrl:
              type: string
      required:
      - statusCode
      - message
      - data
    UpdateCurrentUserHealthProfileRequest:
      type: object
      properties:
        heightCm:
          type: number
          minimum: 50
          maximum: 250
          description: 50–250
        weightKg:
          type: number
          minimum: 20
          maximum: 300
          description: 20–300
        dateOfBirth:
          type: string
          format: date
          description: YYYY-MM-DD, tuổi ≥ 10
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          description: MALE | FEMALE
        dietarySchoolId:
          type: integer
          description: 1 trong 07 trường phái
        healthGoal:
          type: string
          enum:
          - LOSE_WEIGHT
          - MAINTAIN
          - GAIN_MUSCLE
          description: LOSE_WEIGHT | MAINTAIN | GAIN_MUSCLE
        targetWeightKg:
          type: number
          minimum: 20
          maximum: 300
          description: 20–300
        requiresAlliumFree:
          type: boolean
          default: false
          description: mặc định false — Kiêng ngũ vị tân.
        regionPreference:
          type: string
          enum:
          - NORTH
          - CENTRAL
          - SOUTH
          description: NORTH | CENTRAL | SOUTH
      required:
      - heightCm
      - weightKg
      - dateOfBirth
      - gender
      - dietarySchoolId
      - healthGoal
    UpdateCurrentUserHealthProfileResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            gender:
              type: string
              enum: *id003
            dateOfBirth:
              type: string
              format: date
            heightCm:
              type: number
            currentWeightKg:
              type: number
            targetWeightKg:
              type: number
            bmi:
              type: number
            bmiCategory:
              type: string
            bmrKcal:
              type: number
            tdeeKcal:
              type: number
            targetDailyCalories:
              type: number
            healthGoal:
              type: string
              enum: *id004
            dietarySchool:
              type: object
              properties:
                id:
                  type: integer
                code:
                  type: string
                name:
                  type: string
            requiresAlliumFree:
              type: boolean
            regionPreference:
              type: string
            isStaleMetrics:
              type: boolean
            updatedAt:
              type: string
              format: date-time
      required:
      - statusCode
      - message
      - data
    ReplaceCurrentUserAllergiesRequest:
      type: object
      properties:
        allergens:
          type: array
          items:
            type: object
            properties:
              allergenId:
                type: integer
              notes:
                type: string
          description: mỗi phần tử {allergenId, notes?}; tối đa 20
      required:
      - allergens
    ReplaceCurrentUserAllergiesResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            allergens:
              type: array
              items:
                type: object
                properties:
                  allergenId:
                    type: integer
                  name:
                    type: string
      required:
      - statusCode
      - message
      - data
    CreateCurrentUserWeightEntryRequest:
      type: object
      properties:
        weightKg:
          type: number
          minimum: 20
          maximum: 300
          description: 20–300
        loggedDate:
          type: string
          format: date
          description: YYYY-MM-DD, mặc định hôm nay
        note:
          type: string
          maxLength: 255
          description: ≤ 255 ký tự
      required:
      - weightKg
    CreateCurrentUserWeightEntryResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            logId:
              type: integer
            weightKg:
              type: number
            bmi:
              type: number
            targetDailyCalories:
              type: number
      required:
      - statusCode
      - message
      - data
    ListCurrentUserWeightHistoryResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              logId:
                type: integer
              weightKg:
                type: number
              loggedDate:
                type: string
                format: date
        meta:
          type: object
          properties:
            page:
              type: integer
            size:
              type: integer
            total:
              type: integer
      required:
      - statusCode
      - message
      - data
    DeleteCurrentUserRequest:
      type: object
      properties:
        confirmPassword:
          type: string
          description: bắt buộc với tài khoản mật khẩu
        googleIdToken:
          type: string
          description: bắt buộc với tài khoản chỉ dùng Google
        reason:
          type: string
          maxLength: 255
          description: ≤ 255 ký tự
    DeleteCurrentUserResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            restoreDeadline:
              type: string
              format: date-time
      required:
      - statusCode
      - message
      - data
    ListDietarySchoolsResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              dietarySchoolId:
                type: integer
              schoolCode:
                type: string
                enum: &id012
                - VEGAN
                - OVO
                - LACTO
                - LACTO_OVO
                - BUDDHIST
                - POLLOTARIAN
                - PESCATARIAN
              schoolName:
                type: string
              forbiddenFoodGroups:
                type: array
                items:
                  type: string
              forbidAllium:
                type: boolean
      required:
      - statusCode
      - message
      - data
    ListAllergensResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              allergenId:
                type: integer
              code:
                type: string
              allergenName:
                type: string
      required:
      - statusCode
      - message
      - data
    ListCategoriesResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              categoryId:
                type: integer
              categoryName:
                type: string
              isCore:
                type: boolean
      required:
      - statusCode
      - message
      - data
    ListIngredientsResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              ingredientId:
                type: integer
              name:
                type: string
              standardUnit:
                type: string
              foodGroup:
                type: string
                enum: &id014
                - PLANT
                - EGG
                - DAIRY
                - POULTRY
                - SEAFOOD
              isAllium:
                type: boolean
              caloriesPer100g:
                type: number
        meta:
          type: object
          properties:
            page:
              type: integer
            size:
              type: integer
            total:
              type: integer
      required:
      - statusCode
      - message
      - data
    ListRecipesResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              recipeId:
                type: integer
              type:
                type: string
              title:
                type: string
              imageUrl:
                type: string
              dietarySchool:
                type: string
              cookTimeMinutes:
                type: integer
              caloriesKcal:
                type: number
              voteCount:
                type: integer
              isVerified:
                type: boolean
        meta:
          type: object
          properties:
            page:
              type: integer
            size:
              type: integer
            total:
              type: integer
            signUpPromptAtItem:
              type: integer
      required:
      - statusCode
      - message
      - data
    GetRecipeResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            recipeId:
              type: integer
            type:
              type: string
            title:
              type: string
            imageUrl:
              type: string
            dietarySchool:
              type: string
            cookTimeMinutes:
              type: integer
            caloriesKcal:
              type: number
            voteCount:
              type: integer
            isVerified:
              type: boolean
            description:
              type: string
            servings:
              type: integer
            prepTimeMinutes:
              type: integer
            instructions:
              type: array
              items:
                type: string
            ingredients:
              type: array
              items:
                type: object
                properties:
                  ingredientId:
                    type: integer
                  name:
                    type: string
                  quantity:
                    type: integer
                  unit:
                    type: string
            hasTranscript:
              type: boolean
            commentCount:
              type: integer
            memberActions:
              type: object
              properties:
                canVote:
                  type: boolean
                canComment:
                  type: boolean
                canReport:
                  type: boolean
      required:
      - statusCode
      - message
      - data
    CreateRecipeRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 100
          description: 10–100 ký tự
        categoryId:
          type: integer
          minimum: 1
          description: '> 0'
        dietarySchoolId:
          type: integer
          description: 1 trong 07
        description:
          type: string
          maxLength: 1000
          description: ≤ 1000 ký tự
        instructions:
          type: array
          items:
            type: string
          description: ≥ 2 bước
        prepTimeMinutes:
          type: integer
          minimum: 0
          description: ≥ 0
        cookTimeMinutes:
          type: integer
          minimum: 1
          description: '> 0'
        servings:
          type: integer
          minimum: 1
          description: ≥ 1
        difficultyLevel:
          type: string
          enum:
          - EASY
          - MEDIUM
          - HARD
          description: EASY | MEDIUM | HARD
        ingredients:
          type: array
          items:
            type: object
            properties:
              ingredientId:
                type: integer
              quantity:
                type: integer
              unit:
                type: string
          description: mỗi phần tử {ingredientId, quantity, unit, isOptional?}
        imageUrl:
          type: string
          format: uri
          description: URL Cloudinary (FN-POST-08)
        submit:
          type: boolean
          default: false
          description: false = lưu nháp (mặc định false)
      required:
      - title
      - categoryId
      - dietarySchoolId
      - instructions
      - cookTimeMinutes
      - ingredients
    CreateRecipeResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            recipeId:
              type: integer
            status:
              type: string
            aiConfidence:
              type: number
      required:
      - statusCode
      - message
      - data
    UpdateRecipeRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 100
          description: 10–100 ký tự
        categoryId:
          type: integer
          minimum: 1
          description: '> 0'
        dietarySchoolId:
          type: integer
          description: 1 trong 07 trường phái — Đổi ⇒ kiểm duyệt lại
        description:
          type: string
          maxLength: 1000
          description: ≤ 1000 ký tự
        instructions:
          type: array
          items:
            type: string
          description: ≥ 2 bước
        prepTimeMinutes:
          type: integer
          minimum: 0
          description: ≥ 0
        cookTimeMinutes:
          type: integer
          minimum: 1
          description: '> 0'
        servings:
          type: integer
          minimum: 1
          description: ≥ 1
        difficultyLevel:
          type: string
